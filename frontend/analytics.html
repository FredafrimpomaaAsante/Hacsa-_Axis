<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operations Analytics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <span class="brand-mark"></span>
        <div class="brand-title">OpsHub</div>
      </div>

      <h1 class="page-title">Operations Analytics</h1>

      <div class="topbar-actions">
        <button class="secondary-btn" type="button" onclick="window.location.href='command-center.html'">Command Center</button>
        <button class="secondary-btn" type="button" onclick="window.location.href='safety.html'">Safety</button>
        <button class="theme-toggle" type="button" data-theme-toggle>Light mode</button>
      </div>
    </header>

    <main class="page-content">
      <section class="summary-strip">
        <div class="metric-box">
          <span class="card-label">Check-ins</span>
          <strong id="analyticsCheckins">0</strong>
        </div>
        <div class="metric-box">
          <span class="card-label">Avg. Wait</span>
          <strong id="analyticsWait">0m</strong>
        </div>
        <div class="metric-box">
          <span class="card-label">Throughput</span>
          <strong id="analyticsThroughput">0%</strong>
        </div>
        <div class="metric-box">
          <span class="card-label">Staff Utilization</span>
          <strong id="analyticsStaff">0%</strong>
        </div>
      </section>

      <section class="summary-strip">
        <div class="metric-box">
          <span class="card-label">Avg. Response Time</span>
          <strong id="avgResponseTime">0m</strong>
        </div>
        <div class="metric-box">
          <span class="card-label">Incidents Today</span>
          <strong id="incidentsToday">0</strong>
        </div>
        <div class="metric-box">
          <span class="card-label">Resolved</span>
          <strong id="incidentsResolved">0</strong>
        </div>
        <div class="metric-box">
          <span class="card-label">SLA Breaches</span>
          <strong id="slaBreaches">0</strong>
        </div>
      </section>

      <section class="chart-panel">
        <div class="panel-header">
          <h2 class="panel-title">Check-ins per Hour</h2>
          <span class="live-badge">Updated</span>
          <button id="exportBtn" class="primary-btn" type="button">Export Report</button>
        </div>
        <div id="barChart" class="bar-chart"></div>
      </section>
    </main>
  </div>

  <script src="theme.js"></script>
  <script src="analytics.js"></script>
</body>
</html>
